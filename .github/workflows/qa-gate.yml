name: Zarp QA Gate

on:
  push:
    branches:
      - 'feat/**'

jobs:
  qa-gate:
    name: QA Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://frontend-pages-master-cabinets.vercel.app' }}
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Report build result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.event.head_commit.author.name }}"

          echo "=============================="
          echo "Zarp QA Gate — Build Report"
          echo "=============================="
          echo "Branch  : $BRANCH"
          echo "Commit  : $COMMIT"
          echo "Author  : $AUTHOR"
          echo "Message : $MSG"
          echo "Status  : $STATUS"
          echo "=============================="

          if [ "$STATUS" = "success" ]; then
            echo "✅ QA PASSED — branch is clean and ready for review."
          else
            echo "❌ QA FAILED — fix issues above before requesting merge."
          fi
